name: Build Validation

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - development
  push:
    branches:
      - main
      - master
      - develop
      - development
      - feature/**

jobs:
  validate-build-and-tests:
    name: Validate build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore EstateFlow.sln

      - name: Build solution
        run: dotnet build EstateFlow.sln -v minimal

      - name: Execute test suite
        run: dotnet test EstateFlow.sln -v minimal

      - name: Report validation summary
        if: always()
        run: |
          echo "Build validation workflow completed."
          if [ "${{ job.status }}" != "success" ]; then
            echo "Validation failed. Review the build or test logs above for details."
            exit 1
          fi
