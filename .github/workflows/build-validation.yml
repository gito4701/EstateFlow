name: Build Validation

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - development
  push:
    branches:
      - main
      - master
      - develop
      - development
      - feature/**

jobs:
  validate-build-and-tests:
    name: Validate build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Restore dependencies
        run: dotnet restore EstateFlow.sln

      - name: Build solution
        run: dotnet build EstateFlow.sln -v minimal

      - name: Execute test suite
        run: dotnet test EstateFlow.sln -v minimal

      - name: Prepare build artifact
        if: success()
        run: |
          mkdir -p build-artifact/estateflow-build
          cp -R src/EstateFlow.Api/bin/Debug/net9.0/. build-artifact/estateflow-build/
          cat > build-artifact/estateflow-build/build-metadata.json <<EOF
          {
            "buildIdentifier": "github-run-${{ github.run_id }}",
            "commitIdentifier": "${{ github.sha }}",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunNumber": "${{ github.run_number }}",
            "repository": "${{ github.repository }}",
            "ref": "${{ github.ref }}"
          }
          EOF
          echo "Created build artifact package with build metadata."

      - name: Publish workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: estateflow-build-${{ github.run_number }}
          path: build-artifact/
          if-no-files-found: error

      - name: Report validation summary
        if: always()
        run: |
          echo "Build validation workflow completed."
          if [ "${{ job.status }}" != "success" ]; then
            echo "Validation failed. Review the build or test logs above for details."
            exit 1
          fi
