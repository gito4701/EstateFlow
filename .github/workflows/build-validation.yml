name: Build Validation

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - development
  push:
    branches:
      - main
      - master
      - develop
      - development
      - feature/**

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore EstateFlow.sln

      - name: Build solution
        run: dotnet build EstateFlow.sln -v minimal

      - name: Run tests
        run: dotnet test EstateFlow.sln -v minimal
