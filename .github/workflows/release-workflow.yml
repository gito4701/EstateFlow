name: Release Workflow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-validation:
    name: Validate release build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj

      - name: Clean solution
        run: dotnet clean EstateFlow.sln

      - name: Restore dependencies
        run: dotnet restore EstateFlow.sln

      - name: Build solution
        run: dotnet build EstateFlow.sln -c Release -v minimal

      - name: Execute test suite
        run: dotnet test EstateFlow.sln -c Release -v minimal

      - name: Prepare release package directory
        if: success()
        run: |
          rm -rf release-package
          mkdir -p release-package/estateflow-release
          echo "Prepared deterministic release package directory."

      - name: Package release build output
        if: success()
        run: |
          cp -R src/EstateFlow.Api/bin/Release/net9.0/. release-package/estateflow-release/
          echo "Copied the release build output into the package directory."

      - name: Generate release metadata
        if: success()
        run: |
          cat > release-package/release-metadata.json <<EOF
          {
            "buildIdentifier": "release-${{ github.run_number }}-${{ github.run_id }}",
            "commitSha": "${{ github.sha }}",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunNumber": "${{ github.run_number }}",
            "repository": "${{ github.repository }}",
            "tag": "${{ github.ref_name }}",
            "buildTimestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          echo "Generated release metadata payload."

      - name: Validate release package structure
        if: success()
        run: |
          test -d release-package/estateflow-release
          test -f release-package/release-metadata.json
          find release-package -maxdepth 2 -type f | sort
          echo "Validated release package structure and metadata file presence."

      - name: Validate release metadata contents
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          metadata_path = Path('release-package/release-metadata.json')
          data = json.loads(metadata_path.read_text(encoding='utf-8'))
          required = ['buildIdentifier','commitSha','workflowRunId','workflowRunNumber','repository','tag','buildTimestamp']
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit(f'Missing required metadata fields: {missing}')
          print('Validated metadata keys:', ', '.join(required))
          PY

      - name: Upload packaged build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: estateflow-release-package-${{ github.run_number }}
          path: release-package/estateflow-release/
          if-no-files-found: error

      - name: Upload release metadata artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: estateflow-release-metadata-${{ github.run_number }}
          path: release-package/release-metadata.json
          if-no-files-found: error

      - name: Report release workflow summary
        if: always()
        run: |
          echo "Release workflow completed."
          if [ "${{ job.status }}" != "success" ]; then
            echo "Release workflow failed. Review the build or test logs above for details."
            exit 1
          fi
